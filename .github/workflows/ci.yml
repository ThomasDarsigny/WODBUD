name: CI

'on':
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: Type check + Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fitness-app/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  e2e:
    name: Parcours de bout en bout (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fitness-app/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Supabase est entièrement simulé (e2e/supabase-mock.ts) : aucun secret.
      # Chrome est déjà installé sur le runner Ubuntu.
      - name: Parcours de bout en bout
        run: npx playwright test
        env:
          CI: 'true'

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: fitness-app/playwright-report
          retention-days: 7
